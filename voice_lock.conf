# V49 VOICE LOCK — cau hinh
# ==========================
#
# Dung cho ca ban Python (tse_run/voice_lock.py) va ban C++ (tse_cpp).
# Ca hai tu tim file nay o: thu muc hien tai, ../ , ../../
# Hoac chi ro: --config /duong/dan/voice_lock.conf
#
# Thu tu uu tien:  mac dinh  <  file nay  <  tham so dong lenh
# Nghia la van ghi de duoc khi can, vi du:
#     ./tse_voice_lock live --power 4
#
# Cu phap: key = value. Dong bat dau bang # la ghi chu.
# Go sai ten key se bao loi chu khong bo qua im lang.


# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

# Chi can ten file — tu do trong models/ , ../models/ , ../../models/
model   = v49_int8.onnx

# WavLM encoder cho che do enroll. Bo trong thi tu tim wavlm_sv_int8.onnx
encoder = wavlm_sv_int8.onnx

# Speaker embedding tao boi che do enroll
emb     = speaker_emb.npy


# ---------------------------------------------------------------------------
# Tinh chinh tach giong
# ---------------------------------------------------------------------------

# Mask sharpening: 1 = tat (nhanh nhat), 2 = mac dinh, 3 = manh, 4 = toi da
# Tang power -> chan giong khac tot hon nhung mat them nang luong giong dich
power   = 2

# Bu gain dau ra (dB). Model chi lam yeu di duoc nen can bu lai, 0-4
gain    = 4

# Nguong quyet dinh LOCKED. Theo do benchmark:
#   giong dung  ~ -3.5 den -4.5 dB
#   giong khac  ~ -11 den -14 dB
# Nen -8 nam giua. Sieu chat thi -6, de dai thi -10
lock_db = -8

# So thread ONNX. Pi 5 co 4 core
threads = 4


# ---------------------------------------------------------------------------
# Thiet bi am thanh (chi ban C++ / ALSA)
#
# Xem danh sach:  ./tse_voice_lock devices
# Dung plughw: chu khong dung hw: — de ALSA tu chuyen sample rate.
# Bo trong hoac de "default" thi se tu do card khi default hong.
# ---------------------------------------------------------------------------

# in_device  = plughw:1,0
# out_device = plughw:2,0
in_device  = plughw:2,0
out_device = plughw:2,0


# ---------------------------------------------------------------------------
# Enroll
# ---------------------------------------------------------------------------

# Do dai ghi am enrollment (giay). 10-15 s cho embedding phan biet tot hon
seconds = 10


# ---------------------------------------------------------------------------
# Ghi file ket qua
# ---------------------------------------------------------------------------

# Prefix luu wav khi chay live. Bo trong = khong luu
# save   = demo1

# Duong dan mac dinh cho che do file
# output = extracted.wav
