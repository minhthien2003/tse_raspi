# V49 VOICE LOCK - configuration
# ===============================
#
# Shared by the Python port (tse_run/voice_lock.py) and the C++ build
# (tse_cpp). Both look for this file in the current directory, ../ and ../../
# Or point at it explicitly: --config /path/to/voice_lock.conf
#
# Precedence:  defaults  <  this file  <  command line
# So you can still override anything when you need to:
#     ./tse_voice_lock live --power 4
#
# Syntax: key = value. Lines starting with # are comments.
# A misspelled key raises an error instead of being silently ignored.


# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------

# The bare filename is enough - it is searched under models/ , ../models/ ,
# and ../../models/
model   = v49_int8.onnx

# WavLM encoder used by the enroll mode. Leave blank to auto-detect
# wavlm_sv_int8.onnx
#encoder = wavlm_sv_int8.onnx

# Speaker embedding produced by the enroll mode
emb     = speaker_emb.npy


# ---------------------------------------------------------------------------
# Extraction tuning
# ---------------------------------------------------------------------------

# Mask sharpening: 1 = off (fastest), 2 = default, 3 = strong, 4 = maximum.
#
# Each step costs about 6 dB of output level, because the final attenuation
# follows:   suppress_dB = 20 * power * log10(mask)
# Higher power rejects other voices better but also strips more energy from
# the target. Start at 2 and only raise it once `verify` shows a gap > 6 dB.
power   = 2

# Output gain in dB. The model's mask can only attenuate, so some make-up
# gain is needed. Useful range 0-4. Note this does NOT change the measured
# suppression - it is removed from the measurement on purpose.
gain    = 4

# LOCKED decision threshold. From the benchmark numbers:
#   correct voice ~ -3.5 to -4.5 dB
#   other voice   ~ -11 to -14 dB
# -8 sits between them. Use -6 to be strict, -10 to be lenient.
lock_db = -8

# ONNX thread count. The Pi 5 has 4 cores.
threads = 4

# Normalize the OUTPUT FILE to peak 0.95: off | peak
# Applied after suppression is measured, so the figures stay honest and the
# gap between LOCKED and REJECT segments is preserved.
# norm  = peak


# ---------------------------------------------------------------------------
# Audio devices
#
# List them with:  ./tse_voice_lock devices
# Prefer plughw: over hw: so ALSA converts the sample rate for you.
# Leave blank (or "default") to auto-probe when 'default' is broken.
#
# NOTE: the C++ build talks to ALSA directly and understands 'plughw:2,0'.
# The Python port goes through PortAudio, which wants a device index - it
# maps ALSA-style names by matching '(hw:N,0)' in the device name, and warns
# if it cannot.
# ---------------------------------------------------------------------------

in_device  = plughw:2,0
out_device = plughw:2,0


# ---------------------------------------------------------------------------
# Enrollment
# ---------------------------------------------------------------------------

# Recording length in seconds. 10-15 s gives a more distinctive embedding
# than 3 s, which matters most for telling apart speakers of the same gender.
seconds = 10


# ---------------------------------------------------------------------------
# Output files
# ---------------------------------------------------------------------------

# Prefix for the wav files written by live mode. Blank = do not record.
# save   = demo1

# Default output path for file mode
# output = extracted.wav
